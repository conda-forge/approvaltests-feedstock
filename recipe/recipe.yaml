schema_version: 1

context:
  version: "19.1.1"

recipe:
  name: approvaltests
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/a/approvaltests/approvaltests-${{ version }}.tar.gz
    sha256: 0b049a815e5c8462a8dfde2b781bb5956c822e980b8ddd8c270a657a4d78dda3
    target_directory: approvaltests
  - url: https://pypi.org/packages/source/a/approval-utilities/approval_utilities-${{ version }}.tar.gz
    sha256: 33bd42b568bddae052f97e4d2b2061835b2ddba2262b857dedd895bde975f450
    target_directory: approval-utilities

build:
  number: 1
  noarch: python

about:
  license: Apache-2.0
  license_file: approvaltests/LICENSE
  homepage: https://github.com/approvals/ApprovalTests.Python

outputs:
  - package:
      name: approval-utilities

    build:
      script:
        - cd approval-utilities
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

    requirements:
      host:
        - python ${{ python_min }}.*
        - setuptools >=69.0.0
        - wheel
        - pip
      run:
        - python >=${{ python_min }}
        - typing_extensions >=4.12.0

    tests:
      - python:
          imports:
            - approval_utilities
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"

    about:
      summary: Utilities for your production code that work well with approvaltests

  - package:
      name: approvaltests

    build:
      script:
        - cd approvaltests
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

    requirements:
      host:
        - python ${{ python_min }}.*
        - pip
        - setuptools
      run:
        - python >=${{ python_min }}
        # requirements.prod.required.txt
        - pytest >=8.0.0
        - empty-files >=0.0.3
        - typing_extensions >=4.12.0
        # requirements.prod.extras.txt
        - pyperclip >=1.5.29
        - beautifulsoup4 >=4.9.0
        - allpairspy >=2.1.0
        - testfixtures >=7.1.0,<12
        - mock >=5.1.0
        - psutil >=5.9.0
        - approval-utilities ==${{ version }}

    tests:
      - python:
          imports:
            - approvaltests
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"

    about:
      summary: Assertion/verification library to aid testing

extra:
  recipe-maintainers:
    - apmorton
    - mgorny
