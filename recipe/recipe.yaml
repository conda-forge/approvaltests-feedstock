schema_version: 1

context:
  version: "21.0.0"

package:
  name: approvaltests
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/approvaltests/approvaltests-${{ version }}.tar.gz
  sha256: 4e209b3dfa2ab5a0008700202e49c3ce1142b0c226b97c5dd65685f8f9ac5277

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    # requirements.prod.required.txt
    - pytest >=8.0.0
    - empty-files >=0.0.3
    - typing_extensions >=4.16.0
    # requirements.prod.extras.txt
    - pyperclip >=1.5.29
    - beautifulsoup4 >=4.9.0
    - allpairspy >=2.1.0
    - testfixtures >=7.1.0,<12
    - mock >=5.1.0
    - psutil >=5.9.0
    - approval-utilities ==${{ version }}

tests:
  - python:
      imports:
        - approvaltests
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Assertion/verification library to aid testing
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/approvals/ApprovalTests.Python

extra:
  recipe-maintainers:
    - apmorton
    - mgorny
